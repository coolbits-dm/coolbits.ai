<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CoolBits</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <style>
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,sans-serif;background:#0b0f14;color:#e6edf3}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{max-width:760px;width:100%;background:#111823;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:28px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:14px}
    .brand img{width:32px;height:32px}
    .title{font-size:20px;margin:0}
    .subtitle{opacity:.8;margin:10px 0 18px;line-height:1.5}
    .actions{display:flex;gap:12px;flex-wrap:wrap}
    a.btn{display:inline-block;padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.14);color:#e6edf3;text-decoration:none}
    a.btn.primary{background:#1f6feb;border-color:#1f6feb}
    .footer{margin-top:18px;display:flex;gap:14px;flex-wrap:wrap;opacity:.8;font-size:14px}
    .footer a{color:#e6edf3;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.2)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="brand">
        <img src="/favicon.ico" alt="CoolBits" />
        <h1 class="title">CoolBits</h1>
      </div>
      <p class="subtitle">
        Chat interface and legal resources.
      </p>
      <div class="actions">
        <a class="btn primary" href="/chat">Open Chat</a>
        <a class="btn" href="/connectors.html">Connectors</a>
      </div>
      <div class="footer">
        <a href="/legal/terms">Terms</a>
        <a href="/legal/privacy">Privacy</a>
        <a href="/contact.html">Contact</a>
      </div>
    </div>
  </div>
</body>
</html>
