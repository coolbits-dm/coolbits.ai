<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact · CoolBits.ai</title>
    <link rel="stylesheet" href="/assets/style.css?v=council-pill-v11" />
    <link rel="icon" href="/favicon.ico" />
    <style>
      body {
        overflow: auto;
        min-height: 100vh;
        background: radial-gradient(circle at top, #111827, #020203);
        color: rgba(226, 232, 240, 0.92);
        display: flex;
        flex-direction: column;
      }

      .cb-static-shell {
        max-width: 980px;
        margin: 0 auto;
        padding: 44px 22px 42px;
        flex: 1;
        width: 100%;
      }

      .cb-static-card {
        background: rgba(15, 23, 42, 0.78);
        border: 1px solid rgba(148, 163, 184, 0.22);
        border-radius: 18px;
        padding: 22px 22px;
        box-shadow: 0 18px 55px rgba(0, 0, 0, 0.45);
      }

      h1 {
        margin: 0 0 10px;
        font-size: 1.65rem;
        font-weight: 750;
      }

      p {
        color: rgba(226, 232, 240, 0.82);
      }

      form {
        margin-top: 14px;
      }

      label {
        display: block;
        font-size: 0.9rem;
        font-weight: 650;
        margin: 12px 0 6px;
        color: rgba(226, 232, 240, 0.88);
      }

      input,
      textarea {
        width: 100%;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid rgba(148, 163, 184, 0.22);
        background: rgba(2, 6, 23, 0.55);
        color: rgba(226, 232, 240, 0.92);
        font-size: 0.98rem;
        outline: none;
      }

      textarea {
        min-height: 130px;
        resize: vertical;
      }

      input:focus,
      textarea:focus {
        border-color: rgba(95, 225, 207, 0.65);
        box-shadow: 0 0 0 4px rgba(95, 225, 207, 0.08);
      }

      .cb-contact-actions {
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: flex-end;
        margin-top: 14px;
      }

      .cb-contact-status {
        margin-top: 14px;
        font-size: 0.95rem;
      }

      .cb-contact-status.is-error {
        color: #fca5a5;
      }

      .cb-contact-status.is-success {
        color: rgba(95, 225, 207, 0.95);
      }

      .cb-hp {
        position: absolute;
        left: -10000px;
        top: auto;
        width: 1px;
        height: 1px;
        overflow: hidden;
      }

      .cb-turnstile {
        position: absolute;
        left: -10000px;
        top: auto;
        width: 1px;
        height: 1px;
        overflow: hidden;
      }

      .cb-static-links {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        margin-top: 18px;
        font-size: 0.95rem;
      }

      .cb-static-links a {
        color: rgba(226, 232, 240, 0.9);
      }
    </style>
  </head>
  <body>
    <main class="cb-static-shell">
      <section class="cb-static-card">
        <h1>Contact</h1>
        <p>Send us a message and we’ll get back to you.</p>

        <form id="cb-contact-form">
          <div class="cb-hp" aria-hidden="true">
            <label for="cb-contact-hp">Leave this empty</label>
            <input id="cb-contact-hp" name="hp" type="text" tabindex="-1" autocomplete="off" />
          </div>

          <label for="cb-contact-name">Name (optional)</label>
          <input id="cb-contact-name" name="name" type="text" maxlength="120" autocomplete="name" />

          <label for="cb-contact-company">Company (optional)</label>
          <input id="cb-contact-company" name="company" type="text" maxlength="200" autocomplete="organization" />

          <label for="cb-contact-email">Email</label>
          <input id="cb-contact-email" name="email" type="email" maxlength="254" autocomplete="email" required />

          <label for="cb-contact-website">Website (optional)</label>
          <input id="cb-contact-website" name="website" type="url" maxlength="200" autocomplete="url" />

          <label for="cb-contact-message">Message</label>
          <textarea id="cb-contact-message" name="message" maxlength="4000" required></textarea>

          <div id="cb-turnstile" class="cb-turnstile" aria-hidden="true"></div>

          <div class="cb-contact-actions">
            <button class="btn-primary" type="submit" id="cb-contact-submit">Send</button>
          </div>

          <div id="cb-contact-status" class="cb-contact-status" role="status" aria-live="polite"></div>
        </form>
      </section>
    </main>
    <footer data-cb-footer></footer>
    <script src="/assets/site-footer.js"></script>
    <script>
      (() => {
        const form = document.getElementById("cb-contact-form");
        const submit = document.getElementById("cb-contact-submit");
        const status = document.getElementById("cb-contact-status");
        const nameEl = document.getElementById("cb-contact-name");
        const companyEl = document.getElementById("cb-contact-company");
        const emailEl = document.getElementById("cb-contact-email");
        const websiteEl = document.getElementById("cb-contact-website");
        const messageEl = document.getElementById("cb-contact-message");
        const hpEl = document.getElementById("cb-contact-hp");
        const turnstileHost = document.getElementById("cb-turnstile");

        if (!form || !submit || !status || !emailEl || !messageEl || !hpEl || !turnstileHost) return;

        const setStatus = (text, kind) => {
          status.textContent = text || "";
          status.classList.toggle("is-error", kind === "error");
          status.classList.toggle("is-success", kind === "success");
        };

        const isValidEmail = (value) => {
          const email = (value || "").trim();
          return /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email);
        };

        const state = {
          siteKey: null,
          loaded: false,
          widgetId: null,
          pending: null,
        };

        window.cbTurnstileOnload = () => {
          state.loaded = true;
          maybeRenderTurnstile();
        };

        const maybeRenderTurnstile = () => {
          if (!state.loaded) return;
          if (!state.siteKey) return;
          if (!window.turnstile || typeof window.turnstile.render !== "function") return;
          if (state.widgetId != null) return;
          try {
            state.widgetId = window.turnstile.render(turnstileHost, {
              sitekey: state.siteKey,
              size: "invisible",
              callback: (token) => {
                const pending = state.pending;
                state.pending = null;
                if (pending && typeof pending.resolve === "function") {
                  pending.resolve(token);
                }
              },
              "error-callback": () => {
                const pending = state.pending;
                state.pending = null;
                if (pending && typeof pending.reject === "function") {
                  pending.reject(new Error("captcha_failed"));
                }
              },
              "expired-callback": () => {
                const pending = state.pending;
                state.pending = null;
                if (pending && typeof pending.reject === "function") {
                  pending.reject(new Error("captcha_failed"));
                }
              },
            });
          } catch (_err) {
            state.widgetId = null;
          }
        };

        const loadTurnstileConfig = async () => {
          try {
            const res = await fetch("/api/public/contact-config", { cache: "no-store" });
            const json = await res.json().catch(() => ({}));
            const key = typeof json?.turnstileSiteKey === "string" ? json.turnstileSiteKey.trim() : "";
            state.siteKey = key || null;
            if (!state.siteKey) {
              setStatus("Contact form is temporarily unavailable. Please try again later.", "error");
            }
            maybeRenderTurnstile();
          } catch (_err) {
            state.siteKey = null;
            setStatus("Contact form is temporarily unavailable. Please try again later.", "error");
          }
        };

        const getTurnstileToken = async () => {
          if (!state.siteKey || !state.loaded || state.widgetId == null || !window.turnstile) {
            throw new Error("captcha_failed");
          }

          if (state.pending) {
            throw new Error("captcha_failed");
          }

          return new Promise((resolve, reject) => {
            const timeout = window.setTimeout(() => {
              state.pending = null;
              reject(new Error("captcha_failed"));
            }, 12000);

            state.pending = {
              resolve: (token) => {
                window.clearTimeout(timeout);
                resolve(token);
              },
              reject: (err) => {
                window.clearTimeout(timeout);
                reject(err || new Error("captcha_failed"));
              },
            };

            try {
              window.turnstile.reset(state.widgetId);
              window.turnstile.execute(state.widgetId);
            } catch (_err) {
              window.clearTimeout(timeout);
              state.pending = null;
              reject(new Error("captcha_failed"));
            }
          });
        };

        loadTurnstileConfig();

        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          setStatus("", "");

          const hp = (hpEl.value || "").trim();
          if (hp) {
            setStatus("Thanks — message received.", "success");
            form.reset();
            return;
          }

          const name = (nameEl?.value || "").trim();
          const company = (companyEl?.value || "").trim();
          const email = (emailEl.value || "").trim();
          const message = (messageEl.value || "").trim();
          const website = (websiteEl?.value || "").trim();

          if (!isValidEmail(email)) {
            setStatus("Please enter a valid email address.", "error");
            emailEl.focus();
            return;
          }
          if (message.length < 10) {
            setStatus("Please write a longer message (at least 10 characters).", "error");
            messageEl.focus();
            return;
          }

          submit.disabled = true;
          submit.textContent = "Sending…";

          try {
            const token = await getTurnstileToken();
            const res = await fetch("/api/contact", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                name,
                email,
                message,
                company,
                website,
                hp,
                turnstileToken: token,
              }),
            });

            const data = await res.json().catch(() => ({}));
            if (res.ok) {
              setStatus("Thanks — message received.", "success");
              form.reset();
              return;
            }

            const code = typeof data?.error === "string" ? data.error : "";
            if (res.status === 400 && code === "captcha_failed") {
              setStatus("Captcha failed, please retry.", "error");
              return;
            }
            if (res.status === 429 || code === "rate_limited") {
              setStatus("Too many submissions. Please try again in a little while.", "error");
              return;
            }
            if (res.status === 400 || code === "invalid_input") {
              setStatus("Please check the form fields and try again.", "error");
              return;
            }
            if (res.status === 503 || code === "mail_not_configured") {
              setStatus("Contact form is temporarily unavailable. Please try again later.", "error");
              return;
            }
            setStatus("We couldn't send your message right now. Please try again later.", "error");
          } catch (_err) {
            setStatus("We couldn't send your message right now. Please try again later.", "error");
          } finally {
            submit.disabled = false;
            submit.textContent = "Send";
          }
        });
      })();
    </script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=cbTurnstileOnload" async defer></script>
  </body>
</html>
