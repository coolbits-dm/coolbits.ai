name: guardrails

on:
  pull_request:
    branches:
      - main
      - master
      - cleanup/prune-non-cbpl

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Connectors registry guardrails
        run: npm run test:registry

      - name: CBPL guardrails
        run: node tools/cbpl-guardrails-test.js
